name: Build Jarvis APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Jarvis Assistant v1.2.0 (Custom Audio & Priyanka Memory Update)
          body: |
            ### 🚀 Jarvis Assistant v1.2.0
            Download and install the APK directly on your phone!
            
            #### 🌟 What's New:
            - **Custom Audio Clips Support**: Now supports playing real MP3/WAV audio files for greetings, caller announcements, and voicemails!
            - **Updated Relationship Memory Defaults**: Changed all references and prompts to 'Priyanka'.
            - **Stark AI Persona Engine**: Full 10 Iron Man AIs with custom audio fallback to TTS.
            
            #### 🌟 New: 10 Iconic Stark AI Persona Voices:
            - **J.A.R.V.I.S.** (Calm British butler AI)
            - **F.R.I.D.A.Y.** (Tactical & energetic Irish female AI)
            - **K.A.R.E.N.** (Gentle Spider-Man suit lady AI)
            - **E.D.I.T.H.** (High-tech orbital satellite defense AI)
            - **U.L.T.R.O.N.** (Deep, menacing robotic resonance)
            - **V.E.R.O.N.I.C.A.** (Hulkbuster satellite deployment AI)
            - **J.O.C.A.S.T.A.** (Ethicist & logical synthetic AI)
            - **H.O.M.E.R.** (Vintage armory & estate security AI)
            - **P.L.A.T.O.** (Fast background protocol supervisor)
            - **D.U.M.-E** (Playful workshop robotic arm)
            
            #### 🛡️ Core Capabilities:
            - **100% Offline Speech Recognition & Dynamic Multilingual TTS**
            - **Room Memory Database for Relationship Mapping (bou, maa, boss, etc.)**
            - **Caller Announcement with Relationship Tags**
            - **Autonomous Answering Machine & WhatsApp Notification Reader**
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
