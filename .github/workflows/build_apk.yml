name: Build Jarvis APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jarvis Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log

      - name: Report Build Output
        if: always()
        run: |
          echo "## 📋 Gradle Build Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== Checking APK output ==="
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Push Build Error Log Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-failure-log
          tail -n 300 gradle_build.log > build_error.txt
          git add build_error.txt
          git commit -m "Auto-commit build error log [skip ci]" || true
          git push -f origin build-failure-log || true

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Jarvis Assistant v1.4.0 (F.R.I.D.A.Y. Voice & Free AI Assistant)
          body: |
            ### 🚀 Jarvis Assistant v1.4.0
            Download and install the APK directly on your phone!

            #### 🌟 What's New in v1.4.0:
            - **🎧 Built-in F.R.I.D.A.Y. Signature Voice**: Integrated the user's custom `speech.wav` directly into F.R.I.D.A.Y.'s persona audio! Tapping 'Play F.R.I.D.A.Y. Voice' or activating Friday immediately plays her authentic speech audio!
            - **🤖 Full Free AI Chat Assistant**: Talk naturally to your assistant about anything ("Kemon acho?", "Tumi ke?", "Ki korte paro?", "Ekta joke shonao", weather, jokes, chit-chat in Bengali, Hindi, and English)!
            - **⚡ Smart AI Auto-Reply & Answering Machine**: Unattended calls and WhatsApp messages now receive intelligent, polite auto-replies generated on-the-fly by the AI Assistant!
            - **🔑 Optional Free Google Gemini API**: Built-in 100% Free AI Engine works out-of-the-box, plus you can paste an optional Free Google Gemini API Key for deep conversational mastery!
            - **📱 Phone Contact Picker**: In 'Train New Relationship', pick contacts directly from phone contacts with auto-filled name & number.
            - **🎙️ Arc Reactor Glowing UI**: Pulsing cyan glow animation during voice recognition.
            - **🎧 Custom Voice Studio**: Upload, test, and preview custom greeting, voicemail, and caller alert audio files.

            #### 🛡️ Core Capabilities:
            - **100% Speech Recognition & Dynamic Multilingual TTS**
            - **Room Memory Database for Relationship Mapping (bou, maa, boss, etc.)**
            - **Caller Announcement with Relationship Tags**
            - **Autonomous Answering Machine & WhatsApp Notification Reader**
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
