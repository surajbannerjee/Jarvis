name: Build Jarvis APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jarvis Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log

      - name: Report Build Output
        if: always()
        run: |
          echo "## 📋 Gradle Build Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== Checking APK output ==="
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Push Build Error Log Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-failure-log
          tail -n 300 gradle_build.log > build_error.txt
          git add build_error.txt
          git commit -m "Auto-commit build error log [skip ci]" || true
          git push -f origin build-failure-log || true

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.4
          name: Jarvis Assistant v1.5.4 (Exclusive Friday Voice, Call Fixes & Owner Voice Lock)
          body: |
            ### 🚀 Jarvis Assistant v1.5.4
            Download and install the APK directly on your phone!

            #### 🌟 What's New in v1.5.0:
            - **🎙️ Background "Hi Friday" Wake Word Detection**: No need to open the app manually! Just say "Hi Friday", "Friday", or "ফ্রাইডে" anytime, and Friday immediately wakes up in the background and listens to your command (like "Hey Google").
            - **👩 Dedicated F.R.I.D.A.Y. Core**: Streamlined the assistant into Tony Stark's iconic F.R.I.D.A.Y. AI — cleaner, faster, and permanently active.
            - **🎛️ Sweet & Natural Voice Tuner**: Live pitch (tone) and speech rate sliders to customize Friday's voice into the sweet, melodious voice you love. The customized voice stays consistent across greetings, AI chat, answering machine, and caller alerts.
            - **🌐 Smart Auto-Language Detection**: Automatically detects whether you are speaking Bengali (বাংলা / Banglish), Hindi, or English, and answers naturally in that exact same language.
            - **📞 10s–15s Auto Call Answering + Full Call Recording**: If an incoming call is unanswered within 10–15 seconds, Friday answers the call and automatically records the entire conversation into high-quality AAC audio.
            - **📂 Recorded Calls Player**: Playback, inspect date/time/file size, and manage recorded phone conversations directly from the app interface.
            - **🤖 Built-in Free AI Brain + Optional Gemini API**: Chit-chat, ask questions, or provide instructions seamlessly.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
