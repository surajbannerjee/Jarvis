name: Build Jarvis APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jarvis Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log

      - name: Report Build Error
        if: failure()
        run: |
          echo "## ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Jarvis Assistant v1.3.0 (Contact Picker & Custom Voice Studio)
          body: |
            ### 🚀 Jarvis Assistant v1.3.0
            Download and install the APK directly on your phone!

            #### 🌟 What's New:
            - **Phone Contact Picker**: In 'Train New Relationship', tap 'Choose Contact from Phone' or click the contact name field to pick contacts directly from your address book (auto-fills saved name & number).
            - **Quick Relation Chips**: Instant one-tap relation tags (bou, maa, baba, vai, boss, friend).
            - **Fixed Voice Assistant**: 100% working Arc Reactor voice button with pulsing listening animation, native Bengali/Hindi/English STT, and Google Speech Recognizer fallback.
            - **Custom Voice Studio**: Upload your own downloaded MP3/WAV audio files for:
              1. Assistant Greeting Voice
              2. Answering Machine Voicemail
              3. Incoming Caller Alert
            - **Instant Voice Preview**: In-app play/stop buttons to test uploaded custom voice clips and AI personas.

            #### 🌟 10 Iconic Stark AI Persona Voices:
            - **J.A.R.V.I.S.** (Calm British butler AI)
            - **F.R.I.D.A.Y.** (Tactical & energetic Irish female AI)
            - **K.A.R.E.N.** (Gentle Spider-Man suit lady AI)
            - **E.D.I.T.H.** (High-tech orbital satellite defense AI)
            - **U.L.T.R.O.N.** (Deep, menacing robotic resonance)
            - **V.E.R.O.N.I.C.A.** (Hulkbuster satellite deployment AI)
            - **J.O.C.A.S.T.A.** (Ethicist & logical synthetic AI)
            - **H.O.M.E.R.** (Vintage armory & estate security AI)
            - **P.L.A.T.O.** (Fast background protocol supervisor)
            - **D.U.M.-E** (Playful workshop robotic arm)

            #### 🛡️ Core Capabilities:
            - **100% Speech Recognition & Dynamic Multilingual TTS**
            - **Room Memory Database for Relationship Mapping (bou, maa, boss, etc.)**
            - **Caller Announcement with Relationship Tags**
            - **Autonomous Answering Machine & WhatsApp Notification Reader**
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
